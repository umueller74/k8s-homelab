# Production pins Home Assistant to the node that actually holds the Zigbee
# dongle. The label is published by Node Feature Discovery from the attached
# USB device, so moving the passthrough to another node moves the workload
# with it - no manifest change needed.
#
# Device class 02 is CDC, read from the dongle's bDeviceClass. It is not in
# NFD's default whitelist; see infrastructure/node-feature-discovery.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  template:
    spec:
      nodeSelector:
        feature.node.kubernetes.io/usb-02_1a86_55d4.present: "true"
      containers:
        - name: homeassistant
          # A hostPath CharDevice mount only places the device *node* in the
          # container filesystem. It does not add the device to the container's
          # cgroup v2 eBPF device filter, so open() returns EPERM even for uid 0
          # - verified in this cluster:
          #
          #   open("/dev/null")   -> OK        (on runc's default allowlist)
          #   open("/dev/zigbee") -> EPERM     (166:0 is not)
          #
          # The failure surfaces far from the cause: ZHA just reports "failed to
          # connect" and the obvious suspect is the serial port speed.
          #
          # Kubernetes has no per-container devices: field. The only ways to
          # populate runc's allowlist are a device plugin or privileged. One
          # dongle does not justify another DaemonSet.
          #
          # This supersedes the base manifest's NET_ADMIN/NET_RAW adds.
          securityContext:
            privileged: true
          volumeMounts:
            - name: config
              mountPath: /config
            - name: zigbee
              mountPath: /dev/zigbee
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homeassistant-config
        - name: zigbee
          hostPath:
            path: /dev/zigbee
            type: CharDevice
