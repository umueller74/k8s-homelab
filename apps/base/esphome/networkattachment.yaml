# Gives the ESPHome dashboard a real address on the household LAN. It shows
# device online status via mDNS and resolves *.local names for OTA uploads;
# neither works from the pod network alone.
#
# Same design as homeassistant/lan-macvlan, with its own address. Two details
# are load-bearing:
#
#  * No "gateway". A macvlan default route would take precedence over the pod
#    network and break cluster DNS. The /22 address alone routes LAN traffic
#    out net1; internet and in-cluster traffic keeps using eth0.
#
#  * The explicit 224.0.0.0/4 route. Without it, queries to 224.0.0.251 follow
#    the default route out eth0 into flannel and are never seen on the LAN.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: lan-macvlan
  namespace: esphome
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "name": "lan-macvlan",
      "type": "macvlan",
      "master": "ens19",
      "mode": "bridge",
      "ipam": {
        "type": "static",
        "addresses": [
          { "address": "192.168.3.12/22" }
        ],
        "routes": [
          { "dst": "224.0.0.0/4" }
        ]
      }
    }
