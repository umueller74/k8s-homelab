# MQTTX Web: a static single-page app. The MQTT connection runs in the
# browser (WebSockets only, see mosquitto/ingressroute.yaml), and saved
# connections live in the browser's storage, so the pod keeps no state.
# An init container copies the site to an emptyDir and injects seed.js
# (see seed-configmap.yaml) that pre-registers the Mosquitto connection.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqttx-web
  namespace: mqttx-web
spec:
  replicas: 1

  selector:
    matchLabels:
      app: mqttx-web

  template:
    metadata:
      labels:
        app: mqttx-web

    spec:
      # The image runs http-server as root on port 80. Running it as the
      # image's node user on 8080 needs no privileges.
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

      initContainers:
        - name: inject-seed
          image: emqx/mqttx-web:v1.13.1
          command:
            - sh
            - -c
            - |
              set -e
              cp -r /app/. /site/
              cp /seed/seed.js /site/seed.js
              sed -i 's#<script type="text/javascript" src="/app.js">#<script src="/seed.js"></script>&#' /site/index.html
              grep -q 'src="/seed.js"' /site/index.html
          volumeMounts:
            - name: site
              mountPath: /site
            - name: seed
              mountPath: /seed
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

      containers:
        - name: mqttx-web
          image: emqx/mqttx-web:v1.13.1
          command:
            - http-server
            - /site
            - -p
            - '8080'

          ports:
            - name: http
              containerPort: 8080

          volumeMounts:
            - name: site
              mountPath: /site
              readOnly: true

          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]

      volumes:
        - name: site
          emptyDir: {}
        - name: seed
          configMap:
            name: mqttx-web-seed
