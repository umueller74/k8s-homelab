# Deletes pods that graceful node shutdown left in phase Succeeded/Failed: owned by a
# ReplicaSet, StatefulSet or DaemonSet and finished over MIN_AGE_HOURS ago. Their
# controllers already run replacements, and kube-controller-manager's terminated-pod
# GC only starts at 12500 pods. Job pods (CronJob history) and bare pods are kept.
#
# The script is scripts/pod_cleanup.py (stdlib only), shipped through the
# pod-cleanup-script ConfigMap generated in this directory's kustomization. It talks
# to the API with the pod-cleanup service account (pods: list, delete). Set
# DRY_RUN=true to only list what would go.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pod-cleanup
  namespace: pod-cleanup
spec:
  schedule: '0 5 * * *'
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 300
      template:
        spec:
          serviceAccountName: pod-cleanup
          restartPolicy: Never

          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: cleanup
              image: python:3.13-alpine
              command: ['python', '/app/pod_cleanup.py']

              env:
                - name: MIN_AGE_HOURS
                  value: '1'
                - name: DRY_RUN
                  value: 'false'
                # Read-only rootfs: do not try to write __pycache__.
                - name: PYTHONDONTWRITEBYTECODE
                  value: '1'

              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi

              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ['ALL']

              volumeMounts:
                - name: script
                  mountPath: /app
                  readOnly: true

          volumes:
            - name: script
              configMap:
                name: pod-cleanup-script
