# longhorn-retain, not the default longhorn class: an accidental Kustomization
# delete must not take the database (encrypted provider keys) with it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freellmapi-data
  namespace: freellmapi
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-retain
  resources:
    requests:
      storage: 1Gi
