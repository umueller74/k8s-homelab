# Hermes Agent runs natively on raspi2 (homelab role hermes-agent), not in the
# cluster. No selector: the EndpointSlice next to this file supplies the backend.
apiVersion: v1
kind: Service
metadata:
  name: hermes-agent
  namespace: hermes-agent
spec:
  type: ClusterIP
  ports:
    - name: dashboard
      protocol: TCP
      port: 80
      targetPort: 9119
