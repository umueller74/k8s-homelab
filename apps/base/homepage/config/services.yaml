- Primary Services:
    - Unifi Controller @ UDM Pro:
        href: https://192.168.0.1/
        description: Control your home
        icon: unifi.png
        siteMonitor: https://192.168.0.1
        widget:
            type: unifi
            url: https://192.168.0.1
            username: homepage
            password: '{{HOMEPAGE_VAR_UNIFI_PASSWORD}}'
    - Paperless:
        href: https://paperless.homelab.cs-ol.de/
        icon: paperless.png
        siteMonitor: http://paperless.paperless.svc.cluster.local:8000/accounts/login/
        widget:
            type: paperlessngx
            url: http://paperless.paperless.svc.cluster.local:8000/
            username: mueller
            password: '{{HOMEPAGE_VAR_PAPERLESS_PASSWORD}}'
    - Proxmox Macmini:
        href: https://192.168.1.27:8006/
        icon: proxmox.png
        widget:
            type: proxmox
            url: https://192.168.1.27:8006
            username: root@pam!homepage
            password: '{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}'
            cluster: homelab

    - Proxmox Acemagic:
        href: https://192.168.1.24:8006/
        icon: proxmox.png

- Code:
    - QNAP:
        href: http://192.168.1.240/
