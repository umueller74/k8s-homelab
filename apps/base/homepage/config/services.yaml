        icon: qnap.png
        widget:
            type: qnap
            url: http://192.168.1.240:8080
            username: mueller
            password: '{{HOMEPAGE_VAR_QNAP_PASSWORD}}'
- Home Automation:
    - Octoprint:
        href: http://192.168.1.177/
