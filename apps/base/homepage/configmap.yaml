apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  kubernetes.yaml: |
    mode: cluster
    traefik: true
  settings.yaml: |
    title: Muellernetz.de Homepage
    startUrl: http://homepage.homelab.cs-ol.de
    theme: dark

    useEqualHeights: true
    showStats: true
    providers:
      longhorn:
        url: https://longhorn.homelab.cs-ol.de/

    maxGroupColumns: 3
  custom.css: ''
  custom.js: ''
  bookmarks.yaml: |
    - Developer:
        - Website:
            - abbr: CS
              href: https://cs-ol.de
        - Github:
            - abbr: GH
              href: https://github.com/umueller74
        - Dashboard icons:
            - abbr: DI
              href: https://github.com/homarr-labs/dashboard-icons/tree/main/png
    - Websites:
        - IONOS:
            - abbr: IO
              href: https://mein.ionos.de/home/products?origin=CC.NGH.DE&continue
        - Serverprofis:
            - abbr: SP
              href: https://service.serverprofis.net/clientarea.php
        - cPanel:
            - abbr: CP
              href: https://cp141.sp-server.net:2083/

        - Mega.io:
            - abbr: ME
              href: https://mega.io/login

    - Entertainment:
        - YouTube:
            - abbr: YT
              href: https://youtube.com/
        - Finanzfluss:
            - abbr: FF
              href: https://www.youtube.com/@Finanzfluss

    - Kapital:
        - Raisin:
            - abbr: RA
              href: https://raisin.com/de-de/dashboard
        - Scalable Capital:
            - abbr: SC
              href: https://secure.scalable.capital/u/login
        - Comdirect:
            - abbr: CO
              href: https://kunde.comdirect.de/lp/wt/login
        - DKB:
            - abbr: DB
              href: https://banking.dkb.de/login
  services.yaml: |
    - Primary Services:
        - Unifi Controller @ UDM Pro:
            href: https://192.168.0.1/
            description: Control your home
            icon: unifi.png
            siteMonitor: https://192.168.0.1
            widget:
                type: unifi
                url: https://192.168.0.1
                username: homepage
                password: '{{HOMEPAGE_VAR_UNIFI_PASSWORD}}'
        - Paperless:
            href: http://192.168.1.28:8001/
            icon: paperless.png
            server: docker-lab1
            container: paperless-webserver-1
            widget:
                type: paperlessngx
                url: http://192.168.1.28:8001/
                username: mueller
                password: '{{HOMEPAGE_VAR_PAPERLESS_PASSWORD}}'
        - Proxmox Macmini:
            href: https://192.168.1.27:8006/
            icon: proxmox.png
            widget:
                type: proxmox
                url: https://192.168.1.27:8006
                username: root@pam!homepage
                password: '{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}'
                cluster: homelab

        - Proxmox Acemagic:
            href: https://192.168.1.24:8006/
            icon: proxmox.png

        - Gitea:
            href: http://192.168.0.239/
            icon: gitea.png
            widget:
                type: gitea
                url: http://192.168.0.239
                key: giteaapitoken

        - Ansible Semaphore:
            href: http://192.168.1.28:1200/
            icon: semaphore.png
            server: docker-lab1
            container: semaphore-semaphore-1

        - 'Uptime Kuma':
            href: http://10.7.0.9:3001/
            icon: uptime-kuma.png
            server: docker-ionosxs
            container: uptime-kuma
            widget:
                type: uptimekuma
                url: http://10.7.0.9:3001
                slug: overview

    - Code:
        - NGINX Proxy Manager - INTERN:
            href: http://192.168.0.54:8081/
            icon: nginx-proxy-manager.png
            server: docker-raspi2
            container: nginx-app-1
            widget:
                type: npm
                url: http://192.168.0.54:8081
                username: info@cs-ol.de
                password: '{{HOMEPAGE_VAR_NPM_INTERN_PASSWORD}}'
        - NGINX Proxy Manager - EXTERN:
            href: http://10.7.0.9:8081/
            icon: nginx-proxy-manager.png
            server: docker-ionosxs
            container: nginx-app-1
            widget:
                type: npm
                url: http://10.7.0.9:8081
                username: info@cs-ol.de
                password: '{{HOMEPAGE_VAR_NPM_EXTERN_PASSWORD}}'
        - QNAP:
            href: http://192.168.1.240/
            siteMonitor: http://192.168.1.240/
            icon: qnap.png
            widget:
                type: qnap
                url: http://192.168.1.240:8080
                username: mueller
                password: '{{HOMEPAGE_VAR_QNAP_PASSWORD}}'
    - Prometheus Stack:
        - InfluxDB 2:
            href: http://192.168.1.28:8086/
            siteMonitor: http://192.168.1.28:8086/
            icon: influxdb.png
            server: docker-lab1
            container: influxdb

        # - Tools:
        - Octoprint:
            href: http://192.168.1.177/
            siteMonitor: http://192.168.1.177/
            icon: octoprint.png
            widget:
                type: octoprint
                url: http://192.168.1.177
                key: '{{HOMEPAGE_VAR_OCTOPRINT_KEY}}'
        - ESPHome:
            href: http://192.168.1.28:6052/
            icon: esphome.png
            server: docker-lab1
            container: esphome
            widget:
                type: esphome
                url: http://192.168.1.28:6052
                username: admin
                password: '{{HOMEPAGE_VAR_ESPHOME_PASSWORD}}'
        - TasmoAdmin:
            href: http://192.168.1.28:8000/
            icon: tasmoadmin.png
            server: docker-lab1
            container: tasmoadmin

        - WishList:
            href: http://192.168.1.28:3280/
            icon: wishlist.png
            server: docker-lab1
            container: wishlist-app

    - Monitoring:
        - NTFY:
            href: https://ntfy.meatweb2.duckdns.org/
            siteMonitor: https://ntfy.meatweb2.duckdns.org/
            icon: ntfy.png
            server: docker-ionosxs
            container: ntfy

    - Devices:
        - Stromzähler:
            href: http://192.168.1.74
        - Gaszähler:
            href: http://192.168.1.75
        - Wasserzähler:
            href: http://192.168.1.73
        - Gartenwasser P47:
            href: http://192.168.1.76
        - Gartenwasser P47A:
            href: http://192.168.1.77
        - Drucker Brother MFC-L2960DW:
            href: http://192.168.0.220
            description: printer Web Admin
            icon: printer.png
            siteMonitor: http://192.168.0.220

        - Drucker Kyocera:
            href: http://192.168.1.107
            description: printer Web Admin
            icon: printer.png
            siteMonitor: http://192.168.1.117

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - longhorn:
        # Show the expanded
        expanded: true
        # Shows a node representing the aggregate values
        total: true
        # Shows the node names as labels
        labels: true
        # Show the nodes
        nodes: true
    - resources:
        backend: resources
        expanded: true
        cpu: true
        memory: true
        network: default
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: |
    docker-lab1:
      host: 192.168.1.28
      port: 2375

    docker-lab3:
      host: 192.168.0.239
      port: 2375

    docker-raspi1:
      host: 192.168.0.50
      port: 2375

    docker-raspi2:
      host: 192.168.0.54
      port: 2375

    docker-mamapi:
      host: 192.168.100.98
      port: 2375

    docker-ionos:
      host: 10.7.0.1
      port: 2375

    docker-ionosxs:
      host: 10.7.0.9
      port: 2375
  proxmox.yaml: |
    pve:
      url: https://192.168.1.27:8006
      token: root@pam!homepage
      secret: '{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}'