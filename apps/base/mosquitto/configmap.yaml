# Carried over unchanged from raspi2 (/docker/mosquitto/config/mosquitto.conf),
# except that the empty conf.d include is gone.
#
# allow_anonymous stays true: the devices connect without credentials (decided
# in #123). It applies to every listener, since per_listener_settings is off.
#
# The websockets listener serves MQTTX Web (#126), which connects from the
# browser and cannot speak plain TCP. bind_interface eth0 keeps it on the pod
# network: Traefik reaches it at wss://mqttui.homelab.cs-ol.de/mqtt, but it is
# not opened on the LAN address 192.168.1.25 (net1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: mosquitto
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    allow_anonymous true

    listener 9001
    bind_interface eth0
    protocol websockets

    persistence true
    persistence_location /mosquitto/data/
    persistence_file mosquitto.db

    log_dest stdout
    log_type all
    pid_file /tmp/mosquitto.pid
