# Most of the house (Tasmota devices, Home Assistant) talks through this
# broker, so an outage should mail someone.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: mosquitto
  namespace: mosquitto
  labels:
    release: prometheus
spec:
  groups:
    - name: mosquitto
      rules:
        # absent() also fires while the Deployment is scaled to 0 and there
        # is no target at all.
        - alert: MosquittoDown
          expr: |
            up{namespace="mosquitto", service="mosquitto"} == 0
              or absent(up{namespace="mosquitto", service="mosquitto"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: MQTT broker unreachable
            description: >-
              The Mosquitto metrics endpoint has not been scraped for 5 minutes.
              Devices on 192.168.1.25:1883 and Home Assistant have lost MQTT.
