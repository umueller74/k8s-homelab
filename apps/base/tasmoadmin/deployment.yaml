apiVersion: apps/v1
kind: Deployment
metadata:
  name: tasmoadmin
  namespace: tasmoadmin
spec:
  replicas: 1

  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: tasmoadmin

  template:
    metadata:
      labels:
        app: tasmoadmin

    spec:
      containers:
        - name: tasmoadmin
          image: ghcr.io/tasmoadmin/tasmoadmin:v5.0.0

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          env:
            - name: SSL
              value: "false"

          ports:
            - name: http
              containerPort: 80

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          volumeMounts:
            - name: config
              mountPath: /data

      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: tasmoadmin-config
