# Pins the NAS host key so the backup cannot be silently redirected to another
# host. Public key material, safe to commit. Refresh with:
#   ssh-keyscan -t rsa 192.168.1.240
apiVersion: v1
kind: ConfigMap
metadata:
  name: tasmoadmin-backup-known-hosts
  namespace: tasmoadmin
data:
  known_hosts: |
    192.168.1.240 ssh-rsa 
---
# Nightly copy of the tasmoadmin-config PVC to the NAS over scp.
#
# The PVC is ReadWriteOnce, which Kubernetes enforces per node, not per pod:
# the podAffinity below puts this job on the node where the app pod already
# has the volume attached, so both can mount it at the same time.
#
# TasmoAdmin keeps its state in flat files (devices.csv, MyConfig.json), so a
# plain tar of the volume is consistent enough; the volume is mounted read-only.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tasmoadmin-backup
  namespace: tasmoadmin
spec:
  schedule: '10 4 * * *'
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure

          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - labelSelector:
                    matchLabels:
                      app: tasmoadmin
                  topologyKey: kubernetes.io/hostname

          securityContext:
            seccompProfile:
              type: RuntimeDefault

          containers:
            - name: backup
              image: alpine:3.22

              env:
                - name: APP
                  value: tasmoadmin
                - name: KEEP
                  value: '14'
                - name: NAS_HOST
                  value: '192.168.1.240'
                - name: NAS_PATH
                  value: /share/MD0_DATA/Backup/tasmoadmin
                - name: NAS_USER
                  valueFrom:
                    secretKeyRef:
                      name: tasmoadmin-backup-nas
                      key: username
                # sshpass -e reads the password from SSHPASS, keeping it out of
                # the command line and therefore out of the process list.
                - name: SSHPASS
                  valueFrom:
                    secretKeyRef:
                      name: tasmoadmin-backup-nas
                      key: password

              command:
                - sh
                - -c
                - |
                  set -eu
                  apk add --no-cache openssh-client sshpass tar >/dev/null

                  # UTC: alpine ships no tzdata, so file names carry UTC time.
                  STAMP=$(date -u +%Y-%m-%d_%H%MZ)
                  OUT="/tmp/${APP}-${STAMP}.tar.gz"
                  tar -C /data -czf "$OUT" .

                  SIZE=$(wc -c < "$OUT")
                  [ "$SIZE" -gt 1000 ] || { echo "FATAL: archive implausibly small ($SIZE bytes)" >&2; exit 1; }

                  # The NAS runs OpenSSH 7.6: -O forces the legacy scp protocol,
                  # and ssh-rsa is the only host key type it offers.
                  SSH_OPTS="-o UserKnownHostsFile=/etc/nas/known_hosts -o StrictHostKeyChecking=yes -o HostKeyAlgorithms=+ssh-rsa -o PubkeyAcceptedAlgorithms=+ssh-rsa"
                  sshpass -e ssh $SSH_OPTS "${NAS_USER}@${NAS_HOST}" "mkdir -p '${NAS_PATH}'"
                  sshpass -e scp -O $SSH_OPTS "$OUT" "${NAS_USER}@${NAS_HOST}:${NAS_PATH}/"

                  # Keep the newest $KEEP archives of this app.
                  sshpass -e ssh $SSH_OPTS "${NAS_USER}@${NAS_HOST}" \
                    "cd '${NAS_PATH}' && ls -1t ${APP}-*.tar.gz | sed -n '$((KEEP + 1)),\$p' | while read -r f; do rm -f \"\$f\"; done"

                  echo "Backed up $(basename "$OUT") ($SIZE bytes) to ${NAS_HOST}:${NAS_PATH}"

              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 500m
                  memory: 256Mi

              securityContext:
                allowPrivilegeEscalation: false

              volumeMounts:
                - name: data
                  mountPath: /data
                  readOnly: true
                - name: known-hosts
                  mountPath: /etc/nas
                  readOnly: true

          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: tasmoadmin-config
            - name: known-hosts
              configMap:
                name: tasmoadmin-backup-known-hosts
