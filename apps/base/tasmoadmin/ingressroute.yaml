apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tasmoadmin
  namespace: tasmoadmin
  annotations:
    gethomepage.dev/href: 'https://tasmoadmin.homelab.cs-ol.de'
    gethomepage.dev/enabled: 'true'
    gethomepage.dev/description: TasmoAdmin
    gethomepage.dev/group: Home Automation
    gethomepage.dev/icon: tasmoadmin.png
    gethomepage.dev/app: tasmoadmin
    gethomepage.dev/name: TasmoAdmin
    gethomepage.dev/pod-selector: ''
    gethomepage.dev/weight: '5'
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`tasmoadmin.homelab.cs-ol.de`)
      services:
        - kind: Service
          name: tasmoadmin
          port: 80
  tls: {}
---
# Firmware downloads for OTA upgrades. Tasmota fetches the image over plain
# HTTP from http://<ota_server_ip>:<ota_server_port>/data/firmwares/<file>, so
# TasmoAdmin's OTA settings point at Traefik's IP 10.98.0.200 (pinned in
# apps/production/traefik), port 80 - by IP so updates do not depend on the
# devices' DNS. Only the firmware directory is reachable without TLS; the UI
# stays on websecure.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: tasmoadmin-ota
  namespace: tasmoadmin
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: (Host(`tasmoadmin.homelab.cs-ol.de`) || Host(`10.98.0.200`)) && PathPrefix(`/data/firmwares/`)
      services:
        - kind: Service
          name: tasmoadmin
          port: 80
