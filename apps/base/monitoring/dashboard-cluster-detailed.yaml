apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cluster-detailed
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cluster-detailed.json: |
    {
      "id": null,
      "uid": "cluster-detailed",
      "title": "Cluster Detailed",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "panels": [
        {
          "id": 25,
          "type": "row",
          "title": "Node Detail",
          "collapsed": false,
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "panels": []
        },
        {
          "id": 26,
          "type": "timeseries",
          "title": "CPU Usage % by Node",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "100 * (1 - avg by (instance)(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])))",
              "legendFormat": "{{instance}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "drawStyle": "line",
                "lineWidth": 1,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "calcs": []
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 1
          }
        },
        {
          "id": 27,
          "type": "timeseries",
          "title": "Memory Usage % by Node",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
