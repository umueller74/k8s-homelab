# Dashboard for the QNAP TS-419P, fed by qnapexporter running on the NAS.
# Picked up by the kube-prometheus-stack Grafana sidecar via the grafana_dashboard label.
#
# qnapexporter reuses node_exporter metric names (node_cpu_seconds_total, node_load1,
# node_memory_*), which the cluster's own node-exporter also emits. Every query here is
# therefore pinned to job="qnapexporter" so NAS series never mix with node series.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-qnap
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  qnap.json: |
    {
      "id": null,
      "uid": "qnap-nas",
      "title": "QNAP NAS",
      "description": "Health of the QNAP TS-419P, scraped from qnapexporter on the NAS itself. Every query is pinned to job=\"qnapexporter\" because the exporter reuses node_exporter metric names, which would otherwise collide with the cluster nodes.",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "1m",
      "editable": true,
      "graphTooltip": 1,
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {},
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Overview",
          "collapsed": false,
          "panels": [],
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Uptime",
          "description": "Time since the NAS last booted.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_time_seconds{job=\"qnapexporter\"}",
              "legendFormat": "uptime",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "mappings": []
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "none",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "gridPos": {
            "h": 4,
            "w": 4,
            "x": 0,
            "y": 1
          }
        },
        {
          "id": 3,
          "type": "stat",
          "title": "System temp",
          "description": "Chassis temperature reported by QTS.",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "node_systmp_C{job=\"qnapexporter\"}",
              "legendFormat": "system",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "mappings": [],
              "decimals": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 45
                  },
                  {
                    "color": "red",
                    "value": 55
                  }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
