apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: '87.x.x' # Use the specific version you need
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    prometheus:
      prometheusSpec:
        # Retention settings
        retention: 30d

        # Resource allocation
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi

        # Global scrape/evaluation interval
        scrapeInterval: 15s
        evaluationInterval: 15s

        # Persistent storage for metrics
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 50Gi

        # Talos exposes etcd metrics unauthenticated on :2381 on each control-plane node
        additionalScrapeConfigs:
          - job_name: 'talos-etcd'
            static_configs:
              - targets:
                  - '10.98.0.10:2381'
                  - '10.98.0.11:2381'
                  - '10.98.0.12:2381'

    # Enable node-exporter for node metrics
    prometheus-node-exporter:
      enabled: true

    # Enable kube-state-metrics for Kubernetes object metrics
    kube-state-metrics:
      enabled: true

    # Alertmanager configuration
    alertmanager:
      enabled: true
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi

    # Push gateway for batch jobs
    prometheus-pushgateway:
      enabled: false
