apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: '87.x.x' # Use the specific version you need
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    prometheus:
      prometheusSpec:
        # Retention settings.
        #
        # retentionSize is the load-bearing one: time-based retention alone can
        # never be safe on a fixed volume. Without it this filled the 50Gi disk,
        # compaction stopped completing, the WAL grew to 776 segments, and replay
        # outgrew the startup probe - so the pod was killed mid-replay and
        # restarted from zero, indefinitely.
        #
        # Keep retentionSize comfortably below the volume size (60GiB of 80Gi)
        # so there is headroom for the WAL and for compaction.
        retention: 30d
        retentionSize: 60GiB

        # Default is 900s. A large WAL backlog takes longer than that to replay,
        # and being killed part-way means starting over rather than catching up.
        maximumStartupDurationSeconds: 3600

        # Resource allocation
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi

        # Global scrape/evaluation interval
        scrapeInterval: 15s
        evaluationInterval: 15s

        # Persistent storage for metrics
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 80Gi

        # Talos exposes etcd metrics unauthenticated on :2381 on each control-plane node
        additionalScrapeConfigs:
          - job_name: 'talos-etcd'
            static_configs:
              - targets:
                  - '10.98.0.10:2381'
                  - '10.98.0.11:2381'
                  - '10.98.0.12:2381'
          # qnapexporter on the QNAP NAS, installed by Ansible (homelab repo).
          # The NAS is a 2010 TS-419P and is usually IO-bound, so it answers slowly:
          # scraped less often and with a longer timeout than the global 15s/10s, both
          # to avoid failed scrapes and to keep the extra load off it.
          - job_name: 'qnapexporter'
            scrape_interval: 60s
            scrape_timeout: 30s
            static_configs:
              - targets:
                  - '192.168.1.240:9094'

    # Enable node-exporter for node metrics
    prometheus-node-exporter:
      enabled: true

    # Enable kube-state-metrics for Kubernetes object metrics
    kube-state-metrics:
      enabled: true

    # Alertmanager configuration
    alertmanager:
      enabled: true

      # Replaces the chart's default config (which routes everything to
      # 'null'), so its inhibit rules are repeated here.
      config:
        global:
          resolve_timeout: 5m
          # In-cluster Postfix relay (apps/base/smtp-relay); it handles TLS and
          # authentication towards mail.cs-ol.de, so this hop is plain SMTP.
          smtp_smarthost: smtp-relay.smtp-relay.svc.cluster.local:587
          smtp_from: kubernetes@cs-ol.de
          smtp_require_tls: false
        inhibit_rules:
          - source_matchers:
              - 'severity = critical'
            target_matchers:
              - 'severity =~ warning|info'
            equal:
              - 'namespace'
              - 'alertname'
          - source_matchers:
              - 'severity = warning'
            target_matchers:
              - 'severity = info'
            equal:
              - 'namespace'
              - 'alertname'
          - source_matchers:
              - 'alertname = InfoInhibitor'
            target_matchers:
              - 'severity = info'
            equal:
              - 'namespace'
          - target_matchers:
              - 'alertname = InfoInhibitor'
        route:
          group_by: ['namespace', 'alertname']
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          receiver: email
          routes:
            # Always-firing heartbeat that proves the alert pipeline works
            - receiver: 'null'
              matchers:
                - alertname = "Watchdog"
        receivers:
          - name: 'null'
          - name: email
            email_configs:
              - to: info@cs-ol.de
                send_resolved: true

      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi

    # Push gateway for batch jobs
    prometheus-pushgateway:
      enabled: false

    # Admin credentials sourced from the "grafana-admin" Secret, created directly
    # on the cluster (not in git) in the monitoring namespace.
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: username
        passwordKey: password
