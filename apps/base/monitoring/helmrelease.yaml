apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: '87.x.x' # Use the specific version you need
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    prometheus:
      prometheusSpec:
        # Retention settings
        retention: 30d

        # Resource allocation
        resources:
          requests:
            cpu: 500m
            memory: 1Gi
          limits:
            cpu: 2
            memory: 4Gi

        # Global scrape/evaluation interval
        scrapeInterval: 15s
        evaluationInterval: 15s

        # Persistent storage for metrics
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 50Gi

        # Talos exposes etcd metrics unauthenticated on :2381 on each control-plane node
        additionalScrapeConfigs:
          - job_name: 'talos-etcd'
            static_configs:
              - targets:
                  - '10.98.0.10:2381'
                  - '10.98.0.11:2381'
                  - '10.98.0.12:2381'
          # qnapexporter on the QNAP NAS, installed by Ansible (homelab repo).
          # The NAS is a 2010 TS-419P and is usually IO-bound, so it answers slowly:
          # scraped less often and with a longer timeout than the global 15s/10s, both
          # to avoid failed scrapes and to keep the extra load off it.
          - job_name: 'qnapexporter'
            scrape_interval: 60s
            scrape_timeout: 30s
            static_configs:
              - targets:
                  - '192.168.1.240:9094'

    # Enable node-exporter for node metrics
    prometheus-node-exporter:
      enabled: true

    # Enable kube-state-metrics for Kubernetes object metrics
    kube-state-metrics:
      enabled: true

    # Alertmanager configuration
    alertmanager:
      enabled: true
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: longhorn
              accessModes:
                - ReadWriteOnce
              resources:
                requests:
                  storage: 5Gi

    # Push gateway for batch jobs
    prometheus-pushgateway:
      enabled: false

    # Admin credentials sourced from the "grafana-admin" Secret, created directly
    # on the cluster (not in git) in the monitoring namespace.
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: username
        passwordKey: password
