apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolio
  namespace: portfolio
spec:
  replicas: 1

  # ReadWriteOnce volume: never run two pods at once.
  strategy:
    type: Recreate

  selector:
    matchLabels:
      app: portfolio

  template:
    metadata:
      labels:
        app: portfolio

    spec:
      enableServiceLinks: false

      securityContext:
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: portfolio
          image: ghcr.io/umueller74/portfolio-dashboard:0.17.0

          ports:
            - name: http
              containerPort: 8000

          env:
            - name: DB_PATH
              value: /data/portfolio.db
            - name: INGEST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: ingest-token
            # "Fetch now" button: the fetcher's listener on raspi2 (homelab role portfolio-fetcher)
            - name: FETCH_TRIGGER_URL
              value: http://192.168.0.54:8770/fetch
            # MA 20d/50d crossover alerts via Hermes' Telegram bot; optional, no alerts while unset
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: telegram-bot-token
                  optional: true
            - name: TELEGRAM_CHAT_ID
              valueFrom:
                secretKeyRef:
                  name: portfolio-secrets
                  key: telegram-chat-id
                  optional: true

          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1000
            capabilities:
              drop: [ALL]

          volumeMounts:
            - name: data
              mountPath: /data

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: portfolio
