apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: node-feature-discovery
  namespace: flux-system

spec:
  interval: 10m
  path: ./infrastructure/node-feature-discovery
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  timeout: 10m
