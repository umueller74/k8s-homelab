apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kubelet-serving-cert-approver
  namespace: flux-system

spec:
  interval: 10m
  path: ./infrastructure/kubelet-serving-cert-approver
  prune: true
  wait: true

  sourceRef:
    kind: GitRepository
    name: flux-system

  timeout: 5m
