apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: metallb-config
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/test
  prune: true
  wait: true
  timeout: 10m

  # Decrypt *.sops.yaml Secrets with the test cluster's own age key in flux-system/sops-age
  # (not production's key; see .sops.yaml).
  decryption:
    provider: sops
    secretRef:
      name: sops-age
