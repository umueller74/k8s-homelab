# Everything that needs CRDs installed by the apps (Traefik, cert-manager): a freshly rebuilt
# cluster cannot apply these in the same step as the HelmReleases.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps-config
  namespace: flux-system
spec:
  interval: 10m
  dependsOn:
    - name: apps
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./clusters/test/apps-config
  prune: true
  wait: true
