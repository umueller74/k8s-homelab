# The MetalLB controller is shared with production (same path); only the pool differs.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: metallb
  namespace: flux-system
spec:
  interval: 10m
  path: ./infrastructure/metallb/controller
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 5m
  # The Prometheus Operator CRDs (PodMonitor) exist only on production.
  patches:
    - target:
        kind: HelmRelease
        name: metallb
      patch: |
        apiVersion: helm.toolkit.fluxcd.io/v2
        kind: HelmRelease
        metadata:
          name: metallb
          namespace: flux-system
        spec:
          values:
            prometheus:
              podMonitor:
                enabled: false
