---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m0s
  dependsOn:
    - name: infrastructure
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/production
  prune: true
  wait: true

  # Decrypt *.sops.yaml Secrets (e.g. pihole/unifi-sync) with the age key in flux-system/sops-age
  decryption:
    provider: sops
    secretRef:
      name: sops-age
