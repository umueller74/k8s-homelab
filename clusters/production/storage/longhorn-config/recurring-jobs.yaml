# clusters/production/storage/longhorn-config/recurring-jobs.yaml
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-snapshot
  namespace: longhorn-system
spec:
  # Run daily at midnight
  cron: '0 0 * * *'
  task: snapshot
  groups: []
  # Keep the last 7 snapshots
  retain: 7
  concurrency: 2
  labels:
    type: daily
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-backup
  namespace: longhorn-system
spec:
  # Run weekly on Sunday at 2 AM
  cron: '0 2 * * 0'
  task: backup
  groups: []
  # Keep the last 4 backups
  retain: 4
  concurrency: 1
  labels:
    type: weekly
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-filesystem-trim
  namespace: longhorn-system
spec:
  # Run weekly on Saturday at 3 AM, clear of the snapshot and backup jobs
  cron: '0 3 * * 6'
  task: filesystem-trim
  # Every volume without its own recurring-job labels. homeassistant-config
  # (daily-snapshot label) is deliberately not included.
  groups:
    - default
  retain: 0
  # One volume at a time - all replicas share pve2's NVMe with etcd (#100)
  concurrency: 1
  labels:
    type: weekly
